spring.application.name=Hospital Management System

# JWT
jwt.secret=${JWT_SECRET:9hklsjSTS+3sH5UY5y6zsc81TEuJTsWxZfaQOC5dz2o=}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Database (env-var driven so it works locally and on Render/Railway/Neon free tiers)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hms}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# JPA / Hibernate — schema is owned by Flyway, never auto-generated
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true

# CORS — comma-separated list; set FRONTEND_URL env var to your deployed Vercel URL
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:5174}

server.port=${PORT:8080}

# SMTP — used for OTP verification emails during self-registration (Gmail App Password works free)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Razorpay
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Platform fee kept out of every transaction, in paise (75 = ₹0.75)
platform.fee-paise=${PLATFORM_FEE_PAISE:75}

# Super admin (platform owner) — provisioned on boot if these are set and no SUPER_ADMIN exists yet
superadmin.username=${SUPERADMIN_USERNAME:}
superadmin.password=${SUPERADMIN_PASSWORD:}
superadmin.email=${SUPERADMIN_EMAIL:}
superadmin.phno=${SUPERADMIN_PHNO:}
